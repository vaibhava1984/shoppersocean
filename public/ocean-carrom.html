<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Carrom</title>
<style>
:root{--gold:#ffc83d;--glass:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2b4a6b,#101c2c);color:#fff;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sc{background:var(--glass);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#msg{flex:1;text-align:center;font-size:13px;opacity:.9;line-height:1.25}
canvas{touch-action:none;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#ctl{display:flex;align-items:center;gap:8px;font-size:18px}
#sl{flex:1;height:34px;accent-color:var(--gold)}
button{font:inherit;font-weight:700;font-size:17px;padding:11px 30px;min-width:190px;border:0;border-radius:999px;background:var(--gold);color:#2a1f00;cursor:pointer}
button.alt{background:rgba(255,255,255,.18);color:#fff}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ic{min-width:0;width:38px;height:38px;padding:0;font-size:16px;background:var(--glass);color:#fff;border-radius:50%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,18,30,.78);text-align:center;padding:24px}
#ov h1{margin:0;font-size:clamp(32px,8vw,50px);letter-spacing:-.02em}
#ov p{margin:0;max-width:320px;line-height:1.5;opacity:.92}
</style></head><body>
<div id="top"><button class="ic" id="bp" aria-label="Pause">⏸</button><div class="sc" id="ps">You 0</div><div id="msg"></div><div class="sc" id="cs">CPU 0</div><button class="ic" id="bs" aria-label="Sound">🔊</button></div>
<canvas id="cv"></canvas>
<div id="ctl"><span>◀</span><input type="range" id="sl" min="130" max="470" value="300" aria-label="Move striker"><span>▶</span></div>
<div id="ov"></div>
<script>
const $=i=>document.getElementById(i),rnd=Math.random;
const S=600,F=34,PR=28,PKS=[[44,44],[556,44],[44,556],[556,556]],PY=482,AY=118;
const cv=$('cv'),cx=cv.getContext('2d'),ov=$('ov');let Z=300,dpr=1;
function rs(){Z=Math.max(240,Math.min(innerWidth-12,innerHeight-210,640));dpr=Math.min(devicePixelRatio||1,2);cv.style.width=cv.style.height=Z+'px';cv.width=cv.height=Z*dpr;$('top').style.width=$('ctl').style.width=Z+'px'}
addEventListener('resize',rs);rs();
// ---------- audio (all synthesized) ----------
let ac,mg,mus,sfx,nb,soundOn=true,nt=0,bt=0,ls=0;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=ac.createGain();mg.gain.value=soundOn?.6:0;mg.connect(ac.destination);mus=ac.createGain();mus.gain.value=.45;mus.connect(mg);
 const dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.4;fb.gain.value=.4;mus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mg);
 sfx=ac.createGain();sfx.connect(mg);const n=ac.sampleRate/2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=rnd()*2-1;nb=b;setInterval(sched,100)}ac.resume()}
function tn(f,t,d,ty,v,o,f2){const x=ac.createOscillator(),g=ac.createGain();x.type=ty;x.frequency.setValueAtTime(f,t);if(f2)x.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v,.0002),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);x.connect(g);g.connect(o);x.start(t);x.stop(t+d+.05)}
function nz(t,d,fr,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='bandpass';f.frequency.value=fr;
 g.gain.setValueAtTime(Math.max(v,.0002),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(sfx);s.start(t);s.stop(t+d)}
const fq=s=>261.63*2**(s/12),CH=[[0,4,7],[-3,0,4],[-5,-1,2],[-7,0,5]];
function sched(){if(!ac)return;if(!nt)nt=ac.currentTime+.1;
 while(nt<ac.currentTime+.4){const c=CH[(bt>>3)&3];if(bt%2===0)tn(fq(c[(bt>>1)%3]+12),nt,1.5,'sine',.09,mus);if(bt%8===0)c.forEach(s=>tn(fq(s-12),nt,4,'sine',.07,mus));nt+=.5;bt++}}
function snd(k,v){if(!ac)return;const t=ac.currentTime,vol=Math.min(1,(v||300)/500);if((k==='hit'||k==='wall')&&t-ls<.025)return;if(k==='hit'||k==='wall')ls=t;
 if(k==='hit'){tn(1100+rnd()*400,t,.08,'triangle',.5*vol,sfx,500);nz(t,.03,4000,.5*vol)}
 else if(k==='wall'){tn(170,t,.12,'sine',.6*vol,sfx,80);nz(t,.04,900,.3*vol)}
 else if(k==='pocket'){tn(260,t,.35,'sine',.7,sfx,70);nz(t,.25,500,.35);[.12,.2].forEach(d=>tn(900,t+d,.04,'triangle',.25,sfx,500))}
 else if(k==='queen'){tn(880,t+.1,.8,'sine',.3,sfx);tn(1320,t+.15,.8,'sine',.2,sfx)}
 else if(k==='shoot'){nz(t,.12,2500,.4);tn(400,t,.12,'sine',.3,sfx,150)}
 else if(k==='win')[523,659,784,1047].forEach((f,i)=>tn(f,t+i*.12,.5,'triangle',.4,sfx))
 else if(k==='lose')[392,349,311,262].forEach((f,i)=>tn(f,t+i*.22,.5,'sawtooth',.14,sfx))}
$('bs').onclick=()=>{soundOn=!soundOn;if(mg)mg.gain.value=soundOn?.6:0;$('bs').textContent=soundOn?'🔊':'🔇'};
// ---------- game ----------
const C=[],mk=(x,y,t)=>({x,y,vx:0,vy:0,r:t==='s'?17:13.5,m:t==='s'?2.6:1,t,on:1}),K=mk(300,PY,'s');
let st='menu',paused=false,turn=0,sc=[0,0],DIFF=1,pk=[],foul=false,still=0,rt=0,sx=300,drag=null,aim=null,aiT=0,plan=null,best=0;
try{best=+localStorage.getItem('carrom')||0}catch(e){}
function setup(){C.length=0;C.push(mk(300,300,'q'));
 for(let i=0;i<6;i++){const a=i*Math.PI/3;C.push(mk(300+Math.cos(a)*28.5,300+Math.sin(a)*28.5,i%2?'b':'w'))}
 for(let i=0;i<12;i++){const a=i*Math.PI/6+Math.PI/12;C.push(mk(300+Math.cos(a)*54,300+Math.sin(a)*54,i%2?'w':'b'))}
 K.on=0;C.push(K)}
const say=t=>{$('msg').textContent=t};
function hud(){$('ps').textContent='You '+sc[0];$('cs').textContent='CPU '+sc[1]}
function pocket(p){snd('pocket');if(p.t==='s'){foul=true;return}pk.push(p);if(p.t==='w')sc[0]++;else if(p.t==='b')sc[1]++;else{sc[turn]+=3;snd('queen')}hud()}
function phys(dt){
 for(const p of C){if(!p.on)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;const sp=Math.hypot(p.vx,p.vy);
  if(sp){const ns=sp-(sp*1.3+40)*dt;if(ns<5){p.vx=p.vy=0}else{p.vx*=ns/sp;p.vy*=ns/sp}}
  const L=F+p.r,H=S-F-p.r;let w=0;
  if(p.x<L){p.x=L;p.vx=Math.abs(p.vx)*.8;w=1}else if(p.x>H){p.x=H;p.vx=-Math.abs(p.vx)*.8;w=1}
  if(p.y<L){p.y=L;p.vy=Math.abs(p.vy)*.8;w=1}else if(p.y>H){p.y=H;p.vy=-Math.abs(p.vy)*.8;w=1}
  if(w)snd('wall',sp)}
 for(let i=0;i<C.length;i++){const a=C[i];if(!a.on)continue;for(let j=i+1;j<C.length;j++){const b=C[j];if(!b.on)continue;
  let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy),R=a.r+b.r;if(d>=R||!d)continue;dx/=d;dy/=d;
  const o=R-d,ma=1/a.m,mb=1/b.m,s=ma+mb;a.x-=dx*o*ma/s;a.y-=dy*o*ma/s;b.x+=dx*o*mb/s;b.y+=dy*o*mb/s;
  const vn=(b.vx-a.vx)*dx+(b.vy-a.vy)*dy;if(vn<0){const q=-1.9*vn/s;a.vx-=q*ma*dx;a.vy-=q*ma*dy;b.vx+=q*mb*dx;b.vy+=q*mb*dy;snd('hit',-vn)}}}
 for(const p of C){if(!p.on)continue;for(const q of PKS)if(Math.hypot(p.x-q[0],p.y-q[1])<PR){p.on=0;p.vx=p.vy=0;pocket(p)}}}
function next(){K.on=1;K.y=turn?AY:PY;K.x=turn?300:sx;K.vx=K.vy=0;st='place';plan=null;aiT=1;say(turn?'CPU is thinking…':'Your turn: slide, then drag back and release');$('sl').disabled=!!turn}
function shootAt(dx,dy,p){snd('shoot');const v=250+1450*p;K.vx=dx*v;K.vy=dy*v;st='roll';pk=[];foul=false;still=0;rt=0;say('…');$('sl').disabled=true}
function endTurn(){K.on=0;const me=turn?'b':'w';let own=pk.some(p=>p.t===me||p.t==='q'),m=own?'Nice shot! Go again':'';
 if(foul){const r=C.find(p=>!p.on&&p.t===me);if(r){r.on=1;r.x=300;r.y=300;r.vx=r.vy=0;sc[turn]=Math.max(0,sc[turn]-1);hud()}own=false;m='Foul! Striker pocketed'}
 const wl=C.filter(p=>p.on&&p.t==='w').length,bl=C.filter(p=>p.on&&p.t==='b').length;
 if(!wl||!bl)return over(!wl);
 if(!own)turn^=1;next();if(m)say(m+(turn?' • CPU turn':' • Your turn'))}
function over(win){st='over';$('sl').disabled=true;const pts=sc[0]*10+(win?50:0);if(pts>best){best=pts;try{localStorage.setItem('carrom',best)}catch(e){}}
 snd(win?'win':'lose');menu(win?'You win!':'CPU wins','Your score '+pts+'. Best '+best+'.',[['Play again',start],['Menu',home,'alt']])}
function ai(){const me='b',PK=PKS;let b=null;
 for(const c of C){if(!c.on||c.t==='s'||(c.t!==me&&c.t!=='q'))continue;for(const q of PK){
  const ux=q[0]-c.x,uy=q[1]-c.y,ul=Math.hypot(ux,uy)||1,gx=c.x-ux/ul*(c.r+17),gy=c.y-uy/ul*(c.r+17);
  for(let x=140;x<=460;x+=20){const dx=gx-x,dy=gy-AY,dl=Math.hypot(dx,dy);if(dy<10)continue;const dot=(dx*ux+dy*uy)/(dl*ul);if(dot<.4)continue;
   const s=dot*2-(dl+ul)/900+(c.t==='q'?.2:0);if(!b||s>b.s)b={s,sx:x,a:Math.atan2(dy,dx),p:Math.min(1,.45+(dl+ul)/750)}}}}
 if(!b)b={sx:300,a:Math.PI/2+(rnd()-.5)*.6,p:.7};
 b.a+=[.06,.03,.012][DIFF]*(rnd()*2-1);if(DIFF===0&&rnd()<.3)b.p=.4+rnd()*.6;return b}
function aiStep(dt){aiT-=dt;if(aiT>0)return;if(!plan){plan=ai();K.x=plan.sx;aiT=.7;return}shootAt(Math.cos(plan.a),Math.sin(plan.a),plan.p);plan=null}
// input
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]};
cv.addEventListener('pointerdown',e=>{if(st!=='place'||turn||paused)return;A();drag=pt(e);aim=null});
addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),vx=drag[0]-p[0],vy=drag[1]-p[1],L=Math.hypot(vx,vy);aim=L>6?{x:vx/L,y:vy/L,p:Math.min(1,L/110)}:null});
const rel=()=>{if(!drag)return;drag=null;if(aim&&aim.p>.08&&st==='place'&&!paused)shootAt(aim.x,aim.y,aim.p);aim=null};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
$('sl').addEventListener('input',()=>{sx=+$('sl').value;if(st==='place'&&!turn)K.x=sx;A()});
addEventListener('contextmenu',e=>e.preventDefault());
// menus
function menu(h,p,btns){ov.innerHTML='';ov.style.display='flex';const e=(t,c,x)=>{const n=document.createElement(t);n.className=c||'';n.innerHTML=x||'';ov.appendChild(n);return n};
 e('h1','',h);if(p)e('p','',p);btns.forEach(([l,f,c])=>{e('button',c,l).onclick=f})}
function home(){st='menu';paused=false;$('sl').disabled=true;setup();say('');menu('Ocean Carrom','You play white against the CPU. Pocket all 9 white coins first. The red queen is worth 3 points. Sink your own coin to shoot again. Best score '+best+'.',
 [['Play',start],['Level: '+['Easy','Medium','Hard'][DIFF],()=>{DIFF=(DIFF+1)%3;home()},'alt']])}
let quotaPending=null,quotaSeq=0;
function requestCarromQuota(){return new Promise(resolve=>{const requestId='ocean-carrom-'+(++quotaSeq);quotaPending={requestId,resolve};parent.postMessage({type:'shoppers-ocean-carrom-attempt',requestId,newGame:true},location.origin)})}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const d=e.data||{};if(d.type!=='shoppers-ocean-carrom-attempt-result'||!quotaPending||d.requestId!==quotaPending.requestId)return;const done=quotaPending.resolve;quotaPending=null;done(Boolean(d.allowed))});
async function start(){if(quotaPending)return;const allowed=await requestCarromQuota();if(!allowed){say('Your game quota is exhausted. Please check the quota message above.');return}A();setup();sc=[0,0];turn=0;paused=false;ov.style.display='none';hud();next()}
function pause(on){if(st!=='place'&&st!=='roll')return;paused=on;drag=null;aim=null;
 if(on)menu('Paused','',[['Resume',()=>pause(false)],['New game',start,'alt'],['Menu',home,'alt']]);else ov.style.display='none'}
$('bp').onclick=()=>pause(!paused);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
// drawing
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function coin(p){const c=p.t==='w'?['#ffffff','#d9d2c0']:p.t==='b'?['#4a4a4a','#101010']:p.t==='q'?['#ff7b7b','#b3202a']:['#ffe08a','#d38a1a'];
 cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.arc(p.x+2,p.y+3,p.r,0,7);cx.fill();
 const g=cx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,1,p.x,p.y,p.r);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
 cx.strokeStyle=p.t==='s'?'#8a4a00':'rgba(0,0,0,.35)';cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,p.r*.62,0,7);cx.stroke();
 if(p.t==='s'){cx.beginPath();cx.arc(p.x,p.y,p.r*.25,0,7);cx.fillStyle='#8a4a00';cx.fill()}}
function draw(){const k=Z*dpr/S;cx.setTransform(k,0,0,k,0,0);cx.clearRect(0,0,S,S);
 let g=cx.createLinearGradient(0,0,S,S);g.addColorStop(0,'#a06c36');g.addColorStop(1,'#693f20');cx.fillStyle=g;rr(0,0,S,S,24);cx.fill();
 g=cx.createLinearGradient(0,0,S,S);g.addColorStop(0,'#f1d9a4');g.addColorStop(1,'#e2bf80');cx.fillStyle=g;cx.fillRect(F,F,S-2*F,S-2*F);
 cx.strokeStyle='#6b4423';cx.lineWidth=2;
 [PY,AY].forEach(y=>{[-10,10].forEach(o=>{cx.beginPath();cx.moveTo(120,y+o);cx.lineTo(480,y+o);cx.stroke()});[120,480].forEach(x=>{cx.beginPath();cx.arc(x,y,10,0,7);cx.fillStyle='#c0392b';cx.fill();cx.stroke()})});
 cx.beginPath();cx.arc(300,300,64,0,7);cx.stroke();cx.beginPath();cx.arc(300,300,20,0,7);cx.stroke();
 [[44,44,1,1],[556,44,-1,1],[44,556,1,-1],[556,556,-1,-1]].forEach(([x,y,a,b])=>{cx.beginPath();cx.moveTo(x+a*40,y+b*40);cx.lineTo(x+a*110,y+b*110);cx.stroke()});
 PKS.forEach(q=>{const r=cx.createRadialGradient(q[0],q[1],4,q[0],q[1],PR+2);r.addColorStop(0,'#000');r.addColorStop(1,'#222');cx.fillStyle=r;cx.beginPath();cx.arc(q[0],q[1],PR,0,7);cx.fill()});
 for(const p of C)if(p.on&&p.t!=='s')coin(p);
 if(K.on){if(drag&&aim&&!turn){cx.setLineDash([8,8]);cx.strokeStyle='rgba(60,30,0,.7)';cx.lineWidth=3;cx.beginPath();cx.moveTo(K.x,K.y);cx.lineTo(K.x+aim.x*260,K.y+aim.y*260);cx.stroke();cx.setLineDash([]);
  cx.strokeStyle='#c0392b';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();cx.moveTo(K.x-aim.x*20,K.y-aim.y*20);cx.lineTo(K.x-aim.x*(20+aim.p*70),K.y-aim.y*(20+aim.p*70));cx.stroke();cx.lineCap='butt'}coin(K)}}
// loop
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;
 if(mus)mus.gain.value=(paused||st==='menu'||st==='over')?.2:.45;
 if(!paused){if(st==='roll'){rt+=dt;for(let i=0;i<6;i++)phys(dt/6);
   if(C.some(p=>p.on&&(p.vx||p.vy))&&rt<14)still=0;else{still+=dt;if(still>.35){C.forEach(p=>p.vx=p.vy=0);endTurn()}}}
  else if(st==='place'&&turn===1)aiStep(dt)}
 draw()})(last);
home();
</script></body></html>
