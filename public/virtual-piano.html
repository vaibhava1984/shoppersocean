<script>
(function(){
var NW=66, BASE=24, trans=0, inst='piano', sustain=false, bpm=100, vol=.8;
var AC=null, master=null, comp=null, recordDestination=null, audioRecorder=null, audioChunks=[];
var kb=document.getElementById('kb'), $=function(i){return document.getElementById(i)};
var NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var BLACK={1:1,3:1,6:1,8:1,10:1};
var keyEls={}, active={}, sustained=[], rec=null, recTimer=0, lastRec=null, scaleSet=null, tonicPc=-1;

/* ---------- build keyboard ---------- */
function build(){
  kb.innerHTML=''; keyEls={};
  var wi=0, m=BASE, whites=[];
  for(var i=0;i<NW;i++){
    var mm=m, pc=mm%12; var wMidi=0;
    // find the i-th white key from base
    var x=BASE, c=0, n=x;
    while(true){ if(!BLACK[n%12]){ if(c===i)break; c++; } n++; }
    whites.push(n);
  }
  whites.forEach(function(n){
    var el=document.createElement('div'); el.className='w'; el.dataset.m=n;
    el.innerHTML='<i class="led"></i><i class="dot"></i><span class="lb">'+NAMES[n%12]+(Math.floor(n/12)-1)+'</span>';
    kb.appendChild(el); keyEls[n]=el;
  });
  whites.forEach(function(n,i){
    var b=n+1;
    if(BLACK[b%12] && i<NW-1){
      var el=document.createElement('div'); el.className='b'; el.dataset.m=b;
      var wd=100/NW; el.style.width=(wd*.62)+'%'; el.style.left=((i+1)*wd-wd*.31)+'%';
      el.innerHTML='<i class="led" style="top:6px"></i><i class="dot"></i><span class="lb">'+NAMES[b%12]+'</span>';
      kb.appendChild(el); keyEls[b]=el;
    }
  });
  paintScale(); paintLed();
}

/* ---------- audio ---------- */
function ensure(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  comp=AC.createDynamicsCompressor(); master=AC.createGain(); master.gain.value=vol;
  var conv=AC.createConvolver(), len=Math.floor(AC.sampleRate*.9), buf=AC.createBuffer(2,len,AC.sampleRate);
  for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);}
  conv.buffer=buf; var wet=AC.createGain(); wet.gain.value=.09;
  comp.threshold.setValueAtTime(-14,AC.currentTime); comp.knee.setValueAtTime(18,AC.currentTime); comp.ratio.setValueAtTime(5,AC.currentTime); comp.attack.setValueAtTime(.012,AC.currentTime); comp.release.setValueAtTime(.24,AC.currentTime);
  master.connect(comp); master.connect(conv); conv.connect(wet); wet.connect(comp); comp.connect(AC.destination);
  recordDestination=AC.createMediaStreamDestination();comp.connect(recordDestination);
}
function freq(m){return 440*Math.pow(2,(m+trans-69)/12)}
function noiseBuf(){ if(noiseBuf.b)return noiseBuf.b; var b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return noiseBuf.b=b;}
function drum(m){
  var t=AC.currentTime, k=m%12, g=AC.createGain(); g.connect(master);
  function osc(type,f1,f2,dur,amp){var o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);var e=AC.createGain();e.gain.setValueAtTime(amp,t);e.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(e);e.connect(g);o.start(t);o.stop(t+dur+.05);}
  function nz(f,dur,amp,type){var s=AC.createBufferSource();s.buffer=noiseBuf();var fl=AC.createBiquadFilter();fl.type=type||'highpass';fl.frequency.value=f;var e=AC.createGain();e.gain.setValueAtTime(amp,t);e.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(e);e.connect(g);s.start(t);s.stop(t+dur+.05);}
  if(k===0||k===1) osc('sine',150,40,.4,1.2);
  else if(k===2||k===3){osc('triangle',220,110,.15,.6);nz(1500,.2,.7);}
  else if(k===4) nz(7000,.06,.5);
  else if(k===5||k===6) nz(6000,.45,.45);
  else if(k===7||k===8) osc('sine',200,90,.35,.9);
  else if(k===9||k===10) osc('sine',140,60,.4,.9);
  else {nz(5000,1.1,.5);}
  return {stop:function(){}};
}
var synDel=null;
function mk(type,fr,det){var o=AC.createOscillator();o.type=type;o.frequency.value=fr;if(det)o.detune.value=det;return o;}
function piano(m){
  var t=AC.currentTime,f=freq(m),out=AC.createGain(),lp=AC.createBiquadFilter(),nodes=[];
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(14500,f*12+1800),t);lp.frequency.setTargetAtTime(Math.min(6200,f*4.2+850),t+.025,.8);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.34,t+.008);out.connect(lp);lp.connect(master);
  // Lightweight piano voice: fewer partials and no synthetic noise burst.
  var D=7.2*Math.pow(.5,(m-36)/34)+1.35, B=.00016+(m>72?.0012*(m-72)/12:0), N=Math.min(9,Math.floor(11500/f));
  for(var n=1;n<=N;n++){
    var fn=f*n*Math.sqrt(1+B*n*n), amp=(Math.abs(Math.sin(Math.PI*n*.13))+.08)/Math.pow(n,1.05), d=D/(1+.68*n);
    var o=mk('sine',fn,n<=3?(n-2)*.65:0),g=AC.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(amp*(n===1?.72:.48),t+.006);
    g.gain.setTargetAtTime(.00004,t+.012,Math.max(.035,d*.3));
    o.connect(g);g.connect(out);o.start(t);o.stop(t+D*1.45+1);nodes.push(o);
  }
  var stopped=false;
  return {stop:function(sus){
    if(stopped)return;stopped=true;
    var n=AC.currentTime,r=sus?.9:.16;
    out.gain.cancelScheduledValues(n);
    out.gain.setTargetAtTime(.0001,n,Math.max(.025,r/3));
    nodes.forEach(function(o){try{o.stop(n+r+.12)}catch(e){}});
  }};
}
function brassStr(m){
  var t=AC.currentTime,f=freq(m),out=AC.createGain(),nodes=[];out.gain.value=0;out.connect(master);
  out.gain.linearRampToValueAtTime(.5,t+.07);
  // brass section
  var bl=AC.createBiquadFilter();bl.type='lowpass';bl.Q.value=1.2;bl.frequency.setValueAtTime(f*1.5,t);bl.frequency.exponentialRampToValueAtTime(Math.min(9000,f*7),t+.14);bl.frequency.setTargetAtTime(Math.min(5000,f*4.5),t+.2,.4);
  var bg=AC.createGain();bg.gain.setValueAtTime(0,t);bg.gain.linearRampToValueAtTime(.34,t+.06);bl.connect(bg);bg.connect(out);
  [-5,5].forEach(function(d){var o=mk('sawtooth',f,d);o.connect(bl);o.start(t);nodes.push(o);});
  var pk=AC.createBiquadFilter();pk.type='peaking';pk.frequency.value=Math.min(2200,f*4);pk.gain.value=5;bg.disconnect();bg.connect(pk);pk.connect(out);
  // string section
  var sl=AC.createBiquadFilter();sl.type='lowpass';sl.frequency.value=Math.min(7000,f*5+800);
  var sg=AC.createGain();sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime(.3,t+.35);sl.connect(sg);sg.connect(out);
  var lfo=mk('sine',5.3,0),lg=AC.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(9,t+.7);lfo.connect(lg);lfo.start(t);nodes.push(lfo);
  [-13,0,13].forEach(function(d){var o=mk('sawtooth',f,d);lg.connect(o.detune);o.connect(sl);o.start(t);nodes.push(o);});
  var o2=mk('sawtooth',f/2,0);o2.connect(sl);o2.start(t);nodes.push(o2);
  var stopped=false;
  return {stop:function(){if(stopped)return;stopped=true;var n=AC.currentTime,r=.45;
    out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.setTargetAtTime(.0001,n,r/3.5);
    nodes.forEach(function(o){try{o.stop(n+r+.4)}catch(e){}});}};
}
function synthV(m){
  var t=AC.currentTime,f=freq(m),out=AC.createGain(),nodes=[];
  if(!synDel){synDel=AC.createGain();var dl=AC.createDelay(1),fb=AC.createGain(),df=AC.createBiquadFilter();dl.delayTime.value=.34;fb.gain.value=.38;df.type='lowpass';df.frequency.value=2600;synDel.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(comp);}
  var fl=AC.createBiquadFilter();fl.type='lowpass';fl.Q.value=7;fl.frequency.setValueAtTime(Math.min(14000,f*14),t);fl.frequency.setTargetAtTime(Math.min(3500,f*2.5)+350,t+.01,.22);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.45,t+.012);
  fl.connect(out);out.connect(master);var sd=AC.createGain();sd.gain.value=.3;out.connect(sd);sd.connect(synDel);
  [-15,-5,5,15].forEach(function(d){var o=mk('sawtooth',f,d);var g=AC.createGain();g.gain.value=.22;o.connect(g);g.connect(fl);o.start(t);nodes.push(o);});
  var sub=mk('square',f/2,0),sg=AC.createGain();sg.gain.value=.2;sub.connect(sg);sg.connect(fl);sub.start(t);nodes.push(sub);
  var stopped=false;
  return {stop:function(){if(stopped)return;stopped=true;var n=AC.currentTime,r=.3;
    out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.setTargetAtTime(.0001,n,r/3);
    nodes.forEach(function(o){try{o.stop(n+r+.3)}catch(e){}});}};
}
function toneVoice(m,profile){
  var t=AC.currentTime,f=freq(m),out=AC.createGain(),filter=AC.createBiquadFilter(),nodes=[],stopped=false;
  filter.type='lowpass';filter.frequency.setValueAtTime(Math.min(profile.cutoff||11000,f*(profile.filterMul||12)+900),t);filter.Q.value=profile.q||.35;
  out.gain.setValueAtTime(.0001,t);out.connect(filter);filter.connect(master);
  var partials=profile.partials, attack=profile.attack||.012, peak=profile.peak||.22;
  partials.forEach(function(p,i){
    var o=mk(p.type||'sine',f*(p.mul||i+1),p.detune||0),g=AC.createGain(),level=peak*(p.amp||0);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(level,t+attack);
    if(p.decay){g.gain.setTargetAtTime(.0001,t+attack,Math.max(.035,p.decay/4));}
    o.connect(g);g.connect(out);o.start(t);nodes.push(o);
  });
  out.gain.linearRampToValueAtTime(1,t+attack);
  var release=profile.release||.2;
  return {stop:function(sus){
    if(stopped)return;stopped=true;var now=AC.currentTime,r=sus&&profile.hold!==false?Math.max(release,1.1):release;
    out.gain.cancelScheduledValues(now);out.gain.setValueAtTime(Math.max(.0001,out.gain.value),now);out.gain.setTargetAtTime(.0001,now,Math.max(.018,r/3.5));
    nodes.forEach(function(o){try{o.stop(now+r+.15)}catch(e){}});
  }};
}
function bellVoice(m){
  var t=AC.currentTime,f=freq(m),out=AC.createGain(),nodes=[],stopped=false;
  out.gain.setValueAtTime(1,t);out.connect(master);
  [[1,1,.9],[2, .34,.65],[3, .16,.42],[4.16,.09,.28],[5.4,.045,.2]].forEach(function(p){
    var o=mk('sine',f*p[0],0),g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.19*p[1],t+.004);g.gain.setTargetAtTime(.0001,t+.008,p[2]);
    o.connect(g);g.connect(out);o.start(t);nodes.push(o);
  });
  return {stop:function(){if(stopped)return;stopped=true;var n=AC.currentTime;out.gain.setTargetAtTime(.0001,n,.035);nodes.forEach(function(o){try{o.stop(n+2.8)}catch(e){}});}};
}
function voice(m){
  if(inst==='grand')return piano(m);
  if(inst==='brass')return brassStr(m);
  if(inst==='synth')return synthV(m);
  if(inst==='bells')return bellVoice(m);
  var profiles={
    soft:{peak:.34,attack:.025,release:.28,cutoff:7200,partials:[{mul:1,amp:.72},{mul:2,amp:.18},{mul:3,amp:.055},{mul:4,amp:.018}]},
    electric:{peak:.31,attack:.009,release:.2,cutoff:9000,partials:[{mul:1,amp:.72,type:'sine'},{mul:2.01,amp:.28,type:'sine'},{mul:3.98,amp:.12,type:'sine'},{mul:6,amp:.045,type:'triangle'}]},
    lead:{peak:.16,attack:.008,release:.16,cutoff:5200,q:.7,partials:[{mul:1,amp:.8,type:'sawtooth',detune:-4},{mul:1,amp:.8,type:'sawtooth',detune:4},{mul:2,amp:.12,type:'sine'}]},
    pad:{peak:.12,attack:.32,release:.65,cutoff:4200,q:.4,partials:[{mul:1,amp:.7,type:'sawtooth',detune:-8},{mul:1,amp:.7,type:'sawtooth',detune:8},{mul:2,amp:.12,type:'sine'}]},
    strings:{peak:.14,attack:.22,release:.48,cutoff:5600,q:.5,partials:[{mul:1,amp:.72,type:'sawtooth',detune:-7},{mul:1,amp:.72,type:'sawtooth',detune:7},{mul:2,amp:.13,type:'sine'}]},
    organ:{peak:.24,attack:.012,release:.09,cutoff:10000,partials:[{mul:1,amp:.65},{mul:2,amp:.32},{mul:3,amp:.18},{mul:4,amp:.1},{mul:6,amp:.045}]}
  };
  return toneVoice(m,profiles[inst]||profiles.soft);
}
function voiceOld(m){
  if(inst==='drums') return drum(m);
  var t=AC.currentTime, f=freq(m), out=AC.createGain(), nodes=[];
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(16000,f*8+1500);
  out.connect(lp); lp.connect(master);
  function add(type,mult,amp,det){var o=AC.createOscillator();o.type=type;o.frequency.value=f*mult;if(det)o.detune.value=det;var g=AC.createGain();g.gain.value=amp;o.connect(g);g.connect(out);o.start(t);nodes.push(o);}
  var hold=false, dec=3, rel=.25;
  if(inst==='piano'){
    var h=[1,.55,.3,.18,.1,.06,.04]; h.forEach(function(a,i){add('sine',i+1,a*.5,i?Math.random()*3:0)});
    add('sine',1,.25,6);
    var s=AC.createBufferSource();s.buffer=noiseBuf();var nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=Math.min(4000,f*3);var ng=AC.createGain();ng.gain.setValueAtTime(.18,t);ng.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(nf);nf.connect(ng);ng.connect(out);s.start(t);s.stop(t+.1);
    dec=Math.max(1.2,6-(m-36)*.06); rel=.3;
    out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.9,t+.004);out.gain.exponentialRampToValueAtTime(.35,t+.25);out.gain.exponentialRampToValueAtTime(.001,t+dec);
  } else if(inst==='organ'){
    [1,2,3,4,6].forEach(function(mu,i){add('sine',mu,[.5,.4,.2,.15,.1][i])});
    hold=true; rel=.08; out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.7,t+.03);
  } else if(inst==='harpsi'){
    add('sawtooth',1,.3);add('square',2,.12);add('sawtooth',1,.15,8);
    lp.frequency.value=Math.min(9000,f*6); dec=1.1; rel=.1;
    out.gain.setValueAtTime(.8,t);out.gain.exponentialRampToValueAtTime(.001,t+dec);
  } else if(inst==='harp'){
    add('triangle',1,.7);add('sine',2,.3);add('sine',3,.12);
    dec=2.4; rel=.4; out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.9,t+.003);out.gain.exponentialRampToValueAtTime(.001,t+dec);
  } else { // synth
    add('sawtooth',1,.25,-7);add('sawtooth',1,.25,7);add('square',.5,.15);
    hold=true; rel=.35; lp.frequency.setValueAtTime(Math.min(12000,f*10),t);lp.frequency.exponentialRampToValueAtTime(Math.min(3000,f*3)+200,t+.6);
    out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.55,t+.02);
  }
  var stopped=false;
  return {stop:function(sus){
    if(stopped)return; stopped=true; var n=AC.currentTime, r=sus?Math.max(rel,1.2):rel;
    try{out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(Math.max(out.gain.value,.0002),n);out.gain.exponentialRampToValueAtTime(.0001,n+r);}catch(e){}
    nodes.forEach(function(o){try{o.stop(n+r+.05)}catch(e){}});
  }};
}

/* ---------- note on/off ---------- */
function noteOn(m,src){
  ensure(); if(AC.state==='suspended')AC.resume();
  if(active[m]){ return; }
  active[m]=voice(m);
  var el=keyEls[m]; if(el){el.classList.add(el.classList.contains('b')?'d':'d');}
  if(el)el.classList.add('on');
  if(rec&&src!=='play')rec.push({t:performance.now()-recT0,m:m,on:1});
  songCheck(m);
}
function noteOff(m,src){
  var v=active[m]; if(!v)return; delete active[m];
  var el=keyEls[m]; if(el){el.classList.remove('on');el.classList.remove('d');}
  if(el&&el.classList.contains('d')){}
  if(sustain&&inst!=='drums') sustained.push(v); else v.stop(false);
  if(rec&&src!=='play')rec.push({t:performance.now()-recT0,m:m,on:0});
}
function releaseSustain(){sustained.forEach(function(v){v.stop(true)});sustained=[];}

var ptr={}, zoomPointers={}, keyZoom=1, pinchStart=0, pinchDistance=0;
function pinchGap(){var ids=Object.keys(zoomPointers);if(ids.length<2)return 0;var a=zoomPointers[ids[0]],b=zoomPointers[ids[1]];return Math.hypot(a.x-b.x,a.y-b.y);}

function setKeyZoom(value){keyZoom=Math.max(.55,Math.min(3,value));var w=Math.max(1,stage.clientWidth-20)*3*keyZoom;kb.style.width=w+"px";kb.style.minWidth=w+"px";}
stage.addEventListener("pointerdown",function(e){zoomPointers[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(zoomPointers).length===2){pinchStart=keyZoom;pinchDistance=pinchGap();Object.keys(ptr).forEach(function(id){noteOff(ptr[id]);delete ptr[id];});e.preventDefault();}},{passive:false});
stage.addEventListener("pointermove",function(e){if(!(e.pointerId in zoomPointers))return;zoomPointers[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(zoomPointers).length>=2){var gap=pinchGap();if(pinchDistance>0){setKeyZoom(pinchStart*(gap/pinchDistance));e.preventDefault();}}},{passive:false});

function keyAt(x,y){var e=document.elementFromPoint(x,y);while(e&&e!==kb&&!(e.dataset&&e.dataset.m))e=e.parentNode;return e&&e.dataset&&e.dataset.m?+e.dataset.m:null;}

kb.addEventListener('pointermove',function(e){if(!(e.pointerId in ptr))return;var m=keyAt(e.clientX,e.clientY);var o=ptr[e.pointerId];if(m!==null&&m!==o){noteOff(o);ptr[e.pointerId]=m;noteOn(m);}});

var recT0=0,rtI=0;
function downloadRecording(blob,name){var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},30000);}
function beginAudioCapture(){audioChunks=[];if(!window.MediaRecorder||!recordDestination)return false;try{var mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm";audioRecorder=new MediaRecorder(recordDestination.stream,{mimeType:mime});audioRecorder.ondataavailable=function(e){if(e.data&&e.data.size)audioChunks.push(e.data)};audioRecorder.onstop=function(){if(!audioChunks.length)return;var blob=new Blob(audioChunks,{type:audioRecorder.mimeType||"audio/webm"});downloadRecording(blob,"Shoppers-Ocean-Piano-Recording-"+new Date().toISOString().replace(/[:.]/g,"-")+".webm");audioChunks=[];};audioRecorder.start();return true;}catch(e){console.error("Audio recording could not start",e);audioRecorder=null;return false;}}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function startTimer(){var p=$('rt');p.className='show';$('rtt').textContent='0:00';$('rec').textContent='■ 0:00';clearInterval(rtI);rtI=setInterval(function(){var t=fmt(performance.now()-recT0);$('rtt').textContent=t;$('rec').textContent='■ '+t;},250);}

 ensure();

 else{var r=rec;rec=null;this.classList.remove('on');this.textContent='● Rec';stopTimer(r.length>0);if(audioRecorder&&audioRecorder.state!=="inactive"){try{audioRecorder.stop()}catch(e){console.error(e)}}
  if(r.length){lastRec=r;try{var all=JSON.parse(localStorage.getItem('vp_rec')||'[]');all.push({n:'Recording '+(all.length+1),d:r});if(all.length>10)all.shift();localStorage.setItem('vp_rec',JSON.stringify(all));}catch(e){}}}
};
var pbT=[],pbRAF=0,pbStartedAt=0,pbDuration=0;
var progressFill=$('playProgressFill'),progressTrack=$('playProgress');
function setPlaybackProgress(value){var v=Math.max(0,Math.min(1,value));progressFill.style.transform='scaleX('+v+')';progressTrack.setAttribute('aria-valuenow',String(Math.round(v*100)));}
function animatePlaybackProgress(){var elapsed=performance.now()-pbStartedAt;setPlaybackProgress(elapsed/pbDuration);if(elapsed<pbDuration){pbRAF=requestAnimationFrame(animatePlaybackProgress);}else{pbRAF=0;setPlaybackProgress(1);$('play').textContent='▶ Play';$('play').classList.remove('on');setTimeout(function(){if(!pbRAF&&!pbT.length)setPlaybackProgress(0);},450);}}
function playRec(r){if(!r||!r.length)return;stopPb();ensure();pbDuration=Math.max(1,r[r.length-1].t+300);pbStartedAt=performance.now();setPlaybackProgress(0);pbRAF=requestAnimationFrame(animatePlaybackProgress);r.forEach(function(ev){pbT.push(setTimeout(function(){ev.on?noteOn(ev.m,'play'):noteOff(ev.m,'play');},ev.t));});
 pbT.push(setTimeout(function(){pbT=[];$('play').textContent='▶ Play';$('play').classList.remove('on');},pbDuration));$('play').textContent='■ Stop';$('play').classList.add('on');}
function stopPb(){pbT.forEach(clearTimeout);pbT=[];if(pbRAF){cancelAnimationFrame(pbRAF);pbRAF=0;}setPlaybackProgress(0);for(var m in active)noteOff(+m,'play');$('play').textContent='▶ Play';$('play').classList.remove('on');}

 box.innerHTML='<b>My Recordings</b>'+(all.length?'':'<div>None yet</div>');
 all.forEach(function(r,i){var d=document.createElement('div');d.innerHTML='<span>'+r.n+' ('+Math.round(r.d[r.d.length-1].t/1000)+'s)</span>';
