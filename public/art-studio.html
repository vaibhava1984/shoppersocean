<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Studio Pro</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overscroll-behavior:none;background:#150c33}
#drawingStudio{--ink:#2a2147;position:relative;display:flex;flex-direction:column;gap:8px;padding:8px;height:var(--ds-h,100dvh);overflow:hidden;isolation:isolate;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(120% 80% at 20% 0,#5d3bb5,#2a1760 55%,#150c33);box-sizing:border-box;user-select:none;-webkit-user-select:none;
 *{box-sizing:border-box}
 &::before,&::after{content:"";position:absolute;z-index:-1;border-radius:50%;animation:dsf 14s ease-in-out infinite alternate}
 &::before{width:340px;height:340px;left:-100px;top:35%;background:radial-gradient(circle at 30% 28%,#ffb3e0,#c2328f 55%,#4d0e45)}
 &::after{width:260px;height:260px;right:-70px;top:4%;background:radial-gradient(circle at 30% 28%,#b4efff,#2a8fd1 55%,#0d2c5b);animation-delay:-6s}
 .glass,header,footer,.rail{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);box-shadow:0 8px 20px #0004,inset 0 1px 0 #fff5;border-radius:16px}
 header{display:flex;gap:6px;align-items:center;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
 header>*{flex:none}
 .sp{flex:1!important}
 .logo{font-size:17px;font-weight:700}
 .lvl{display:flex;gap:6px;align-items:center;font-size:13px}
 .mis{display:flex;gap:6px;align-items:center;font-size:13px;padding:0 4px}
 .mtxt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 main{flex:1;min-height:0;display:flex;gap:8px}
 .rail{width:56px;flex:none;display:flex;flex-direction:column;gap:7px;padding:6px;overflow-y:auto;scrollbar-width:none}
 .rail button{width:100%;padding:6px 0;display:flex;flex-direction:column;align-items:center;flex:none}
 .rail i{font-style:normal;font-size:20px;line-height:1.1}
 .rail small{font-size:9px}
 button{font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;padding:8px 11px;border:0;border-radius:12px;background:linear-gradient(#fff,#e4dcff);box-shadow:0 4px 0 #9d8fdc,0 7px 10px #0004;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
 button:active{transform:translateY(3px);box-shadow:0 1px 0 #9d8fdc,0 2px 4px #0004}
 button:focus-visible,input:focus-visible{outline:3px solid #ffcf4a;outline-offset:2px}
 button.on{background:linear-gradient(#ffd75e,#ff8a2b);box-shadow:0 4px 0 #b95a0e,0 7px 10px #0004;font-weight:700}
 button:disabled{opacity:.4;pointer-events:none}
 button.save{background:linear-gradient(#8bf5b0,#1fbf6b);box-shadow:0 4px 0 #0f7d44,0 7px 10px #0004;font-weight:700}
 button.dl{background:linear-gradient(#9fd8ff,#3b8fe8);box-shadow:0 4px 0 #1f5aa8,0 7px 10px #0004;font-weight:700}
 .cell{flex:1;min-width:0;container-type:size;display:grid;place-items:center;padding:10px}
 .stage{position:relative;width:min(100cqw,calc(100cqh*var(--ar,1.6)));aspect-ratio:var(--ar,1.6);background:#fff;border-radius:6px;overflow:hidden;touch-action:none;box-shadow:0 0 0 6px #e9b44c,0 0 0 8px #8a5516,0 18px 30px #000a}
 .stage canvas{position:absolute;inset:0;width:100%;height:100%}
 .fx{cursor:crosshair}
 footer{display:flex;gap:10px;align-items:center;padding:8px}
 .pal{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,32px);grid-auto-columns:32px;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
 .sw{width:32px;height:32px;padding:0;border-radius:50%;box-shadow:inset -3px -4px 6px #0006,inset 3px 3px 5px #fff9,0 3px 5px #0005}
 .sw.on{outline:3px solid #fff;outline-offset:1px;transform:scale(1.12);box-shadow:inset -3px -4px 6px #0006,inset 3px 3px 5px #fff9,0 5px 8px #000a}
 .ctl{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px}
 input[type=range]{width:100px;accent-color:#ff8a2b}
 input[type=color]{width:46px;height:30px;padding:0;border:2px solid #fff;border-radius:10px;background:none}
 .xpbar{width:90px;height:12px;border-radius:9px;background:#0006;overflow:hidden;box-shadow:inset 0 2px 4px #0008}
 .xpbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#ff9a1f);transition:width .3s}
 .toast{position:absolute;left:50%;top:60px;translate:-50% 0;padding:10px 20px;border-radius:30px;background:linear-gradient(#ffd75e,#ff8a2b);color:var(--ink);font-weight:700;opacity:0;pointer-events:none;transition:.4s;z-index:20;text-align:center}
 .toast.show{opacity:1;translate:-50% 20px}
 .modal{position:absolute;inset:0;z-index:10;background:#000a;display:grid;place-items:center;padding:10px}
 .modal[hidden]{display:none}
 .sheet{background:#2a1760;border-radius:20px;padding:14px;max-width:780px;max-height:100%;overflow:auto;box-shadow:0 20px 50px #000}
 .sheet h2{margin:0 0 10px;font-size:18px}
 .book{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px;margin-bottom:12px}
 .book button{padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px}
 .book canvas{width:100%;aspect-ratio:1;border-radius:10px}
}
@keyframes dsf{to{transform:translateY(40px) scale(1.08)}}
@media(prefers-reduced-motion:reduce){#drawingStudio::before,#drawingStudio::after{animation:none}}
@media(max-width:600px){#drawingStudio .logo,#drawingStudio .vol,#drawingStudio .xpbar{display:none}#drawingStudio .rail{width:48px;padding:4px}#drawingStudio{padding:5px;gap:5px}#drawingStudio .cell{padding:8px}#drawingStudio input[type=range]{width:80px}}

<body>

<!-- ===== ART STUDIO PRO: copy from here to the end marker to embed ===== -->
<div id="drawingStudio">
  <div class="toast"></div>
  <header class="studio-header">
    <b class="logo">🎨 Drawing Studio</b>
    <button class="undo" disabled title="Undo">↶ Undo</button>
    <button class="redo" disabled title="Redo">↷ Redo</button>
    <button class="mbtn" title="Music on/off">🔇</button>
    <input type="range" class="vol" min="0" max="100" value="35" aria-label="Music volume">
    <button class="startbtn" type="button">▶ Start</button>
    <button class="pausebtn" type="button" disabled>Ⅱ Pause</button>
    <button class="dl" title="Download artwork">⬇ Download</button>
  </header>
  <div class="pausemenu" hidden><span>⏸ Drawing paused</span><button class="resume" type="button">▶ Resume</button></div>
  <main class="studio-main">
    <nav class="rail toolrail" aria-label="Drawing tools">
      <button data-tool="pencil" title="Pencil"><i>✏️</i><small>Pencil</small></button>
      <button data-tool="marker" title="Marker"><i>🖍️</i><small>Marker</small></button>
      <button data-tool="brush" title="Pro Brush"><i>🖌️</i><small>Pro Brush</small></button>
      <button data-tool="watercolor" title="Watercolour"><i>🎨</i><small>Watercolour</small></button>
      <button data-tool="spray" title="Airbrush"><i>💨</i><small>Airbrush</small></button>
      <button data-tool="glitter" title="Glitter"><i>✨</i><small>Glitter</small></button>
      <button data-tool="bubble" title="3D Puff Brush"><i>🫧</i><small>3D Puff</small></button>
      <button data-tool="depth" title="3D Sculpt Brush"><i>🖋️</i><small>3D Sculpt</small></button>
      <button data-tool="eraser" title="Eraser"><i>🧽</i><small>Eraser</small></button>
      <button class="paper" title="Dark paper"><i>🌙</i><small>Paper</small></button>
      <button class="clear" title="Clear canvas"><i>🗑️</i><small>Clear</small></button>
      <button class="bk" title="Colouring book"><i>📖</i><small>Colouring Book</small></button>
    </nav>
    <footer class="palettebar">
      <div class="pal"></div>
      <div class="ctl"><input type="color" class="custom" value="#e4572e" aria-label="Custom colour"><span><input type="range" class="size" min="1" max="60" value="20"> <b class="sv">20</b></span></div>
      <div class="zoomctl"><button class="zoomout" title="Zoom out">−</button><b class="zoomlabel">100%</b><button class="zoomin" title="Zoom in">+</button></div>
    </footer>
    <div class="cell"><div class="stage"><canvas class="base"></canvas><canvas class="draw"></canvas><canvas class="fx"></canvas></div></div>
  </main>
  <div class="startscreen"><div class="startcard"><div class="starticon">🎨</div><h2>Drawing Studio</h2><p>Your creative space is ready.</p><button class="bigstart" type="button">▶ Start Drawing</button></div></div>
  <div class="modal" hidden><div class="sheet"><h2>📖 Colouring Book</h2><div class="book"></div><button class="close">Close</button></div></div>
</div>
<script>
(()=>{
const P=innerHeight>innerWidth,W=P?1800:2400,H=P?2400:1500;                         // canvas resolution: raise for even sharper exports
const root=document.getElementById('drawingStudio');
const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
const base=q('.base'),draw=q('.draw'),fx=q('.fx');
[base,draw,fx].forEach(c=>{c.width=W;c.height=H});
const bx=base.getContext('2d'),dx=draw.getContext('2d',{willReadFrequently:true}),fc=fx.getContext('2d');

let tool='pencil',color='#e4572e',size=20,brushSize=20,eraserSize=20,solid=false,outline=null,zoom=1;
const cell=q('.cell'),stage=q('.stage');
function applyZoom(){stage.style.width=(100*zoom)+'%';stage.style.setProperty('--zoom',zoom);q('.zoomlabel').textContent=Math.round(zoom*100)+'%'}
q('.zoomin').onclick=()=>{zoom=Math.min(2.5,+(zoom+.2).toFixed(2));applyZoom()};
q('.zoomout').onclick=()=>{zoom=Math.max(1,+(zoom-.2).toFixed(2));applyZoom()};
let down=false,start,last,mid,sprayT,undo=[],redo=[],panning=false,panOrigin=null;

/* ---------- colouring book ---------- */
let dark=false,ink='#26252d';
const S=(p,d)=>p.addPath(new Path2D(d));
const E=(p,cx,cy,rx,ry,r=0)=>{p.moveTo(cx+rx*Math.cos(r),cy+rx*Math.sin(r));p.ellipse(cx,cy,rx,ry,r,0,7);p.closePath()};
const ST=(p,cx,cy,r)=>{for(let i=0;i<10;i++){const g=-Math.PI/2+i*Math.PI/5,k=i%2?.45:1;p[i?'lineTo':'moveTo'](cx+Math.cos(g)*r*k,cy+Math.sin(g)*r*k)}p.closePath()};
const RING=(p,n,d,rx,ry,cx=50,cy=50,o=0)=>{for(let i=0;i<n;i++){const a=i*2*Math.PI/n+o;E(p,cx+d*Math.cos(a),cy+d*Math.sin(a),rx,ry,a)}};
const BOOK=[
{n:'🐱 Cat',f:p=>{S(p,'M20 45L22 12L42 28Q50 26 58 28L78 12L80 45Q82 80 50 88Q18 80 20 45Z');S(p,'M27 21L36 29L28 38Z');S(p,'M73 21L64 29L72 38Z');E(p,38,48,7,9);E(p,62,48,7,9);E(p,38,50,3,5);E(p,62,50,3,5);S(p,'M46 62L54 62L50 68Z');S(p,'M50 68Q44 76 38 72M50 68Q56 76 62 72M18 60L3 56M18 66L3 70M82 60L97 56M82 66L97 70M50 28V36M43 29L45 36M57 29L55 36');E(p,29,67,5,3.5);E(p,71,67,5,3.5)}},
{n:'🦉 Owl',f:p=>{S(p,'M25 30Q25 10 50 10Q75 10 75 30L78 70Q78 92 50 92Q22 92 22 70Z');E(p,38,36,12,12);E(p,62,36,12,12);E(p,38,36,6,6);E(p,62,36,6,6);S(p,'M44 46L56 46L50 58Z');E(p,50,74,17,15);S(p,'M42 64q4 4 8 0q4 4 8 0M40 72q5 4 10 0q5 4 10 0M42 80q4 4 8 0q4 4 8 0');S(p,'M24 45Q8 62 21 82Q31 66 26 50Z');S(p,'M76 45Q92 62 79 82Q69 66 74 50Z');S(p,'M38 92v5M44 92v5M56 92v5M62 92v5M10 97H90')}},
{n:'🦋 Butterfly',f:p=>{S(p,'M50 45Q10 5 8 35Q8 55 50 50Z');S(p,'M50 45Q90 5 92 35Q92 55 50 50Z');S(p,'M50 52Q12 55 20 82Q40 92 50 60Z');S(p,'M50 52Q88 55 80 82Q60 92 50 60Z');E(p,24,30,7,7);E(p,24,30,3,3);E(p,76,30,7,7);E(p,76,30,3,3);E(p,33,72,5,5);E(p,67,72,5,5);S(p,'M47 30Q50 25 53 30L53 75Q50 80 47 75Z');E(p,50,24,5,5);S(p,'M48 20Q40 10 34 8M52 20Q60 10 66 8')}},

    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.075,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.11);
    o.connect(g);g.connect(mg);o.start(t);o.stop(t+.12);
  }catch(_){}
});
fx.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
