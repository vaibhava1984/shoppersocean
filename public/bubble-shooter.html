<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Shooter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08152f;color:white;font-family:system-ui}body{display:flex;flex-direction:column}.head{padding:11px 15px;background:linear-gradient(110deg,#0e7490,#312e81,#581c87);display:flex;justify-content:space-between;font-weight:900}.stage{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at top,#263d77,#08152f 75%)}canvas{width:100%;height:100%;display:block;touch-action:none}.foot{padding:9px;text-align:center;background:#071126;font-size:12px;color:#cbd5e1}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#06122dcc;padding:20px}.panel{max-width:340px;text-align:center;padding:24px;border:1px solid #ffffff40;border-radius:24px;background:linear-gradient(145deg,#172554,#4338a5);box-shadow:0 20px 60px #0009}.panel h2{font-size:26px;margin:5px}.panel p{font-size:13px;line-height:1.6;color:#dbeafe}.btn{border:0;border-radius:30px;padding:11px 22px;background:linear-gradient(90deg,#06b6d4,#6366f1);color:white;font-weight:900}.hide{display:none!important}
</style></head><body>
<header class="head"><span>🫧 Bubble Shooter</span><span>Score: <b id="score">0</b></span></header>
<main class="stage"><canvas id="c"></canvas>
<div class="overlay" id="intro"><div class="panel"><div style="font-size:48px">🫧</div><h2>Bubble Shooter</h2><p>Aim and shoot. Match three or more bubbles of the same colour to clear them. Clear the board to win!</p><button class="btn" id="start">START PLAYING</button></div></div>
<div class="overlay hide" id="check"><div class="panel"><h2>Checking attempt…</h2><p>Please wait.</p></div></div>
<div class="overlay hide" id="end"><div class="panel"><h2 id="result">Game over</h2><p id="detail">Try another round.</p><button class="btn" id="again">PLAY AGAIN</button></div></div>
</main><footer class="foot">Touch or drag to aim · Release to shoot</footer>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),intro=document.getElementById('intro'),check=document.getElementById('check'),end=document.getElementById('end');const palette=['#ff5577','#ffc247','#35d5bc','#5d9cff','#b77aff','#ff8b45'];let w,h,d=1,r=16,grid=[],aim={x:0,y:-1},shot=null,current=0,score=0,allowed=false,pending=false,req='',playing=false;const rand=()=>Math.floor(Math.random()*palette.length);
function size(){const b=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=b.width;h=b.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);r=Math.max(12,Math.min(18,w/23));if(!grid.length)board();draw()}
function px(a,b){return w/2-5*r+b*2*r+(a%2?r:0)}function py(a){return 12+a*1.74*r}
function board(){grid=[];for(let a=0;a<6;a++)for(let b=0;b<10;b++)if(px(a,b)<w-r)grid.push({a,b,k:rand()});score=0;scoreEl.textContent=score;shot=null;current=rand();playing=true;draw()}
function ball(a,b,k,rad=r){const xx=px(a,b),yy=py(a),g=x.createRadialGradient(xx-r*.4,yy-r*.45,1,xx,yy,rad);g.addColorStop(0,'white');g.addColorStop(.25,palette[k]);g.addColorStop(1,'#172554');x.fillStyle=g;x.beginPath();x.arc(xx,yy,rad,0,7);x.fill();x.strokeStyle='#ffffff88';x.stroke()}
function draw(){x.clearRect(0,0,w,h);grid.forEach(b=>ball(b.a,b.b,b.k));const sx=w/2,sy=h-r*2.4;x.setLineDash([5,6]);x.strokeStyle='#ffffff99';x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+aim.x*70,sy+aim.y*70);x.stroke();x.setLineDash([]);x.fillStyle=palette[current];x.beginPath();x.arc(sx,sy,r*1.15,0,7);x.fill();if(shot){x.fillStyle=palette[shot.k];x.beginPath();x.arc(shot.x,shot.y,r,0,7);x.fill()}}
function aimAt(a,b){const dx=a-w/2,dy=b-(h-r*2.4),len=Math.hypot(dx,dy)||1;if(dy<0)aim={x:dx/len,y:dy/len};draw()}
function close(a,b){return Math.hypot(px(a.a,a.b)-px(b.a,b.b),py(a.a)-py(b.a))<r*2.2}
function place(p){const near=grid.slice().sort((a,b)=>Math.hypot(px(a.a,a.b)-p.x,py(a.a)-p.y)-Math.hypot(px(b.a,b.b)-p.x,py(b.a)-p.y))[0];const row=near?near.a:0,col=near?near.b:5,spots=[];for(let a=Math.max(0,row-1);a<=row+1;a++)for(let b=Math.max(0,col-1);b<=col+1;b++)if(!grid.some(q=>q.a===a&&q.b===b)&&px(a,b)>r&&px(a,b)<w-r)spots.push({a,b,k:p.k});spots.sort((a,b)=>Math.hypot(px(a.a,a.b)-p.x,py(a.a)-p.y)-Math.hypot(px(b.a,b.b)-p.x,py(b.a)-p.y));if(!spots.length){finish(false);return}const z=spots[0];grid.push(z);const stack=[z],seen=new Set(),match=[];while(stack.length){const q=stack.pop(),id=q.a+':'+q.b;if(seen.has(id))continue;seen.add(id);match.push(q);grid.filter(n=>n.k===z.k&&close(q,n)).forEach(n=>stack.push(n))}if(match.length>=3){const gone=new Set(match.map(q=>q.a+':'+q.b));grid=grid.filter(q=>!gone.has(q.a+':'+q.b));score+=match.length*20;scoreEl.textContent=score}current=rand();shot=null;if(!grid.length)finish(true);else if(grid.some(q=>py(q.a)>h-r*5))finish(false);draw()}
function animate(){if(!shot)return;shot.x+=shot.vx;shot.y+=shot.vy;if(shot.x<r||shot.x>w-r)shot.vx*=-1;if(shot.y<r*1.4||grid.some(q=>Math.hypot(px(q.a,q.b)-shot.x,py(q.a)-shot.y)<r*1.9)){place(shot);return}draw();requestAnimationFrame(animate)}
function fire(){if(!playing||shot||pending)return;if(!allowed){pending=true;check.classList.remove('hide');req='bubble:'+Date.now()+Math.random();parent.postMessage({type:'shoppers-ocean-bubble-attempt',requestId:req},location.origin);return}const speed=Math.max(7,w*.016);shot={x:w/2,y:h-r*3.4,vx:aim.x*speed,vy:aim.y*speed,k:current};requestAnimationFrame(animate)}
function finish(win){playing=false;shot=null;document.getElementById('result').textContent=win?'Board cleared! 🎉':'Game over';document.getElementById('detail').textContent=win?'Brilliant shooting!':'The bubbles reached the danger line.';end.classList.remove('hide')}
function start(){intro.classList.add('hide');end.classList.add('hide');board()}
c.addEventListener('pointermove',e=>{const b=c.getBoundingClientRect();aimAt(e.clientX-b.left,e.clientY-b.top)});c.addEventListener('pointerdown',e=>{const b=c.getBoundingClientRect();aimAt(e.clientX-b.left,e.clientY-b.top)});c.addEventListener('pointerup',fire);
document.getElementById('start').onclick=start;document.getElementById('again').onclick=()=>{if(allowed)start();else{end.classList.add('hide');intro.classList.remove('hide')}};
addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='shoppers-ocean-bubble-attempt-result'||e.data.requestId!==req)return;pending=false;check.classList.add('hide');if(e.data.allowed){allowed=true;const speed=Math.max(7,w*.016);shot={x:w/2,y:h-r*3.4,vx:aim.x*speed,vy:aim.y*speed,k:current};requestAnimationFrame(animate)}else{playing=false;document.getElementById('result').textContent='Attempts used';document.getElementById('detail').textContent='Your available attempts have been used. Please return after your quota resets.';end.classList.remove('hide')}});
new ResizeObserver(size).observe(c);size()})();
</script></body></html>
