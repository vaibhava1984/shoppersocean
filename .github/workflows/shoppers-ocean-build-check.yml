name: Shoppers Ocean build check

on:
  pull_request:
    branches:
      - cloudflare-safe-migration-final
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Next.js build
        run: npm run build
      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
