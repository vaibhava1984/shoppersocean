name: Shoppers Ocean Consolidated Repair Build

on:
  push:
    branches:
      - consolidated-10min-repair-final

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Next.js build
        run: npm run build
      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
