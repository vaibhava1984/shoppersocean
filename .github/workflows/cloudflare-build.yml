name: Shoppers Ocean build verification

on:
  push:
    branches:
      - cloudflare-safe-migration-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install
      - name: Build Next.js application
        run: bun run build
      - name: Build Cloudflare OpenNext Worker
        run: bunx opennextjs-cloudflare build
      - name: Prepare custom Cloudflare Worker entrypoint
        run: node scripts/prepare-worker-deploy.mjs
      - name: Validate custom Worker and Wrangler configuration
        run: bunx wrangler deploy --config .open-next/wrangler.json --dry-run
