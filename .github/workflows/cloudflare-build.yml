name: Cloudflare migration build check
on:
  push:
    branches:
      - cloudflare-safe-migration-final
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx opennextjs-cloudflare build
