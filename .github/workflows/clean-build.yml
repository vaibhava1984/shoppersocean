name: Shoppers Ocean clean build
on:
  workflow_dispatch:
  push:
    branches:
      - shoppers-ocean-clean-rebuild

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build