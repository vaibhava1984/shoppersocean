# Template for the eventual Cloudflare Workers deployment.
# Keep this file as a template until the Cloudflare account resources exist.

name = "shoppersocean"
compatibility_date = "2026-09-23"
main = "worker/index.ts"

[vars]
# Public, non-secret configuration only.

[[d1_databases]]
binding = "DB"
database_name = "shoppersocean"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "BOOKS_BUCKET"
bucket_name = "shoppersocean-books"

[observability]
enabled = true
